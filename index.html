<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>Job Pilot</title>
<style>
:root{--canvas:#14171c;--surface:#1c2128;--surface2:#262d36;--line:#2f3844;--text:#e7edf5;--muted:#8d9bab;--accent:#3b8cff;--accent-text:#fff;
--t1:#4ad08a;--t1bg:#143627;--t2:#6aa8ff;--t2bg:#162c4d;--t3:#e3b04b;--t3bg:#3a2e12;--skip:#8d9bab;--skipbg:#262d36;--bad:#ff7a6b;--badbg:#40201c;--warn:#f0a35e;--warnbg:#3b2a17;--ai:#b79cff;--aibg:#2a2147}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--canvas);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
header.top{display:flex;align-items:center;gap:10px;padding:max(12px,env(safe-area-inset-top)) 16px 8px;min-height:56px}
header.top h1{font-size:22px;margin:0;flex:1}
main{flex:1;overflow-y:auto;padding:4px 16px 24px;-webkit-overflow-scrolling:touch}
nav.tabs{display:flex;border-top:1px solid var(--line);background:var(--canvas);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 8px;font:500 12px system-ui;min-height:56px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected=true]{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
.btn{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--bad);border-color:#5a2b26}
.btn.ghost{background:none}
.btn.ai{background:var(--aibg);border-color:#43357a;color:var(--ai)}
.btn:disabled{opacity:.45}
input[type=text],input[type=search],input[type=password],textarea,select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-height:44px}
textarea{min-height:96px;resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:13px;color:var(--muted);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.btn2{min-height:36px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:8px 0 10px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{font-size:12px;padding:3px 9px;border-radius:8px;background:var(--surface2);color:var(--text);white-space:nowrap}
.pill.good{background:var(--t1bg);color:var(--t1)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.ai{background:var(--aibg);color:var(--ai)}.pill.blue{background:var(--t2bg);color:var(--t2)}
.tier{font-weight:700;font-size:12px;padding:4px 9px;border-radius:8px}
.tier.t1{background:var(--t1bg);color:var(--t1)}.tier.t2{background:var(--t2bg);color:var(--t2)}.tier.t3{background:var(--t3bg);color:var(--t3)}.tier.ts{background:var(--skipbg);color:var(--skip)}
.swipe{position:relative;margin-bottom:10px;border-radius:16px;overflow:hidden}
.swipe .under{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-weight:700}
.under.apply{background:var(--accent)}.under.skip{background:#5a2b26}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;touch-action:pan-y;transition:transform .18s ease;display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 12px}
.card.dragging{transition:none}
.card .tb{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.card .co{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ti{font-size:16px;font-weight:700;margin:1px 0 6px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;align-items:center}
.card .meta span{white-space:nowrap}
.m-remote{color:var(--t1)}.m-abroad{color:var(--warn);font-weight:600}.m-pay{font-weight:600}.m-route{color:var(--t2)}.m-need{color:var(--warn)}.m-cv{color:var(--ai)}.m-warn{color:var(--bad);font-weight:600}.m-muted{color:var(--muted)}
.fbar{display:flex;gap:8px;align-items:center;padding:4px 0}.fbar input{flex:1;min-width:0}.fbar .btn{white-space:nowrap}.newdot{color:#fff;background:var(--accent);border-radius:6px;padding:0 5px;font-size:10px}.picked{border-color:var(--accent)}.card .tb{border:0;cursor:pointer}.stage{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.stage button{min-height:36px;font-size:13px;padding:6px 10px}.stage .done{background:var(--t1bg);color:var(--t1);border-color:var(--t1)}.bulk{position:sticky;bottom:0;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;gap:8px;margin-top:8px}.bulk .btn{flex:1}input[type=date]{width:auto;min-height:36px;padding:4px 8px}.sub{font-size:12px;color:var(--muted);margin-top:-2px}.banner{background:var(--badbg);border:1px solid #5a2b26;border-radius:12px;padding:10px 12px;margin:6px 0}.hint{color:var(--muted);font-size:12px;text-align:center;margin:2px 0 8px}
.sheet{position:fixed;inset:0;background:var(--canvas);z-index:20;overflow-y:auto;padding:max(12px,env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.sheet .bar{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sheet h2{font-size:20px;margin:6px 0 2px;overflow-wrap:anywhere}
.sec{margin-top:16px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.box+.box{margin-top:8px}
ul.l{margin:0;padding-left:18px}ul.l li{margin:3px 0}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase}
.toast{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;z-index:40;max-width:688px;margin:0 auto}
.toast span{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;display:flex;align-items:flex-end}
.modal .inner{background:var(--surface);width:100%;max-width:720px;margin:0 auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}.small{font-size:12px}
.row2{display:flex;gap:8px;flex-wrap:wrap}.row2>*{flex:1 1 140px}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.kv{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.kv code{overflow-wrap:anywhere;font-size:13px;color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><div style="flex:1"><h1 id="title">Leads</h1><div class="sub" id="upd"></div></div><button class="btn ghost" id="selmode" hidden>Select</button><button class="btn ghost" id="refresh" aria-label="Refresh">↻</button></header>
  <main id="main"></main>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div>
<script>
const REPO_DEFAULT = "abdullahsulehri/job-pilot-engine";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ls = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v) } catch (e) { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} } };
const FDEF = { tier: "all", pay: "all", effort: "all", where: "all", sector: "all", fresh: "all", ind: "all" };
const S = { jobs: [], generated: "", tab: "leads", q: "", f: { ...FDEF, ...ls.get("jp.f", {}) }, sort: ls.get("jp.sort", "best"), hint: ls.get("jp.hint", 1), marks: ls.get("jp.marks", {}), events: ls.get("jp.events", []),
  profile: ls.get("jp.profile", {}), sent: ls.get("jp.sent", []), sel: null, cfg: ls.get("jp.cfg", { repo: REPO_DEFAULT, token: "" }), open: null, loadErr: "" };
const ICON = { home: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', leads: '<path d="M16 11a4 4 0 1 0-8 0M4 21a8 8 0 0 1 16 0"/>', applied: '<path d="M4 4h16v16H4zM8 12l3 3 5-6"/>', profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>' };
const TABS = [["home", "Home"], ["leads", "Leads"], ["applied", "Applied"], ["profile", "Profile"]];
const tc = t => t === "Tier 1" ? "t1" : t === "Tier 2" ? "t2" : t === "Tier 3" ? "t3" : "ts";
const ORDER = { "Tier 1": 0, "Tier 2": 1, "Tier 3": 2, "Skip": 3 };
const BRANK = { "P1 Lahore": 0, "P1 remote (Gulf, NZ, AU)": 1, "Remote worldwide / other": 2, "P2 USA remote": 3, "P3 Gulf onsite": 4 };
const REASONS = ["Pay too low", "Not my level", "Location or visa", "Industry", "Company", "Bad posting", "Already applied", "Other"];
const STAGES = [["applied", "Applied"], ["call", "Call received"], ["int1", "Interview 1"], ["int2", "Interview 2"], ["offer", "Offer"], ["rejected", "Rejected"]];
const today = () => new Date().toISOString().slice(0, 10);

/* ---------- GitHub ---------- */
async function gh(path, opt = {}) {
  const r = await fetch("https://api.github.com/repos/" + S.cfg.repo + path, { ...opt, headers: { Accept: opt.raw ? "application/vnd.github.raw+json" : "application/vnd.github+json", Authorization: "Bearer " + S.cfg.token, "X-GitHub-Api-Version": "2022-11-28", ...(opt.body ? { "Content-Type": "application/json" } : {}) } });
  if (!r.ok) throw new Error("GitHub said " + r.status + (r.status === 401 || r.status === 403 ? " (check the token and its permissions)" : r.status === 404 ? " (file or repo not found)" : ""));
  return opt.raw ? r.json() : r.status === 204 ? null : r.json();
}
async function load() {
  if (!S.cfg.token) { S.loadErr = "Add your GitHub token in Profile to load your jobs."; return render(); }
  try { const d = await gh("/contents/reports/app-jobs.json", { raw: true }); S.jobs = d.jobs; S.generated = d.generated; ls.set("jp.cache", d); S.loadErr = ""; }
  catch (e) { const c = ls.get("jp.cache", null); if (c) { S.jobs = c.jobs; S.generated = c.generated; S.loadErr = "Offline or blocked, showing the saved copy. " + e.message } else S.loadErr = e.message; }
  render();
}
const issue = (title, body, labels) => gh("/issues", { method: "POST", body: JSON.stringify({ title, body, labels }) });
let eventsIssue = ls.get("jp.eventsIssue", null);
async function postEvent(e) {
  if (!eventsIssue) { const i = await issue("App events (do not close)", "Decisions made in the phone app. One comment per decision.", ["app-event"]); eventsIssue = i.number; ls.set("jp.eventsIssue", eventsIssue); }
  await gh("/issues/" + eventsIssue + "/comments", { method: "POST", body: JSON.stringify({ body: "```json\n" + JSON.stringify(e) + "\n```" }) });
}
async function logEvent(ev) {
  const e = { ts: new Date().toISOString(), ...ev }; S.events.push(e); ls.set("jp.events", S.events);
  if (!S.cfg.token) return;
  try { await postEvent(e); e.synced = true; ls.set("jp.events", S.events) } catch (x) {}
}
async function syncEvents() { for (const e of S.events.filter(x => !x.synced)) { try { await postEvent(e); e.synced = true } catch (x) { break } } ls.set("jp.events", S.events) }
async function restore() {
  try {
    if (!eventsIssue) { const l = await gh("/issues?labels=app-event&state=all&per_page=5"); if (!l.length) return toast("No saved log found"); eventsIssue = l[l.length - 1].number; ls.set("jp.eventsIssue", eventsIssue) }
    let page = 1, all = [];
    for (;;) { const c = await gh("/issues/" + eventsIssue + "/comments?per_page=100&page=" + page); all = all.concat(c); if (c.length < 100) break; page++ }
    const marks = {};
    for (const c of all) { const m = c.body.match(/```json\n([\s\S]*?)\n```/); if (!m) continue; let e; try { e = JSON.parse(m[1]) } catch (x) { continue }
      const id = e.job; if (!id) continue; const cur = marks[id] || { stages: {} };
      if (e.action === "applied" || e.action === "skipped") marks[id] = { ...cur, v: e.action, at: (e.ts || "").slice(0, 10), reason: e.reason || "", stages: e.action === "applied" ? { ...cur.stages, applied: (e.ts || "").slice(0, 10) } : cur.stages };
      else if (e.action === "undo") delete marks[id];
      else if (e.action === "reason" && marks[id]) marks[id].reason = e.reason;
      else if (e.action === "stage" && marks[id]) marks[id].stages = { ...marks[id].stages, [e.stage]: e.date } }
    S.marks = marks; ls.set("jp.marks", marks); render(); toast("Restored " + Object.keys(marks).length + " decisions")
  } catch (e) { toast(e.message) }
}

/* ---------- notifications ---------- */
const b64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const unb64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(s.length / 4) * 4, "=")), c => c.charCodeAt(0));
async function ensureVapid() {
  let v = ls.get("jp.vapid", null); if (v) return v;
  const kp = await crypto.subtle.generateKey({ name: "ECDSA", namedCurve: "P-256" }, true, ["sign", "verify"]);
  const pub = await crypto.subtle.exportKey("raw", kp.publicKey), jwk = await crypto.subtle.exportKey("jwk", kp.privateKey);
  v = { pub: b64u(pub), priv: jwk.d }; ls.set("jp.vapid", v); return v;
}
async function enablePush() {
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return toast("This browser cannot receive notifications");
    if (!S.cfg.token) return toast("Save your GitHub token first");
    const perm = await Notification.requestPermission();
    if (perm !== "granted") return toast("Notifications are blocked. Allow them for this app in the phone settings.");
    const v = await ensureVapid(), reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (sub) { const k = sub.options && sub.options.applicationServerKey; if (!k || b64u(k) !== v.pub) { await sub.unsubscribe(); sub = null } }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(v.pub) });
    let n = ls.get("jp.pushIssue", null);
    if (!n) { const l = await gh("/issues?labels=push-sub&state=all&per_page=1"); n = l.length ? l[0].number : (await issue("Push subscriptions (do not close)", "Browser push subscriptions for the owner's devices.", ["push-sub"])).number; ls.set("jp.pushIssue", n) }
    let device = ls.get("jp.device", null); if (!device) { device = Math.random().toString(36).slice(2, 10); ls.set("jp.device", device) }
    await gh("/issues/" + n + "/comments", { method: "POST", body: JSON.stringify({ body: "```json\n" + JSON.stringify({ device, sub: sub.toJSON(), ts: new Date().toISOString() }) + "\n```" }) });
    S.profile.push = true; ls.set("jp.profile", S.profile); render(); toast("Notifications enabled. Now add the key shown in Profile.");
  } catch (e) { toast("Could not enable notifications: " + e.message) }
}
async function showKey() {
  const v = await ensureVapid();
  try { await navigator.clipboard.writeText(v.priv); toast("Key copied. Paste it into GitHub as the secret VAPID_PRIVATE_KEY.") } catch (e) { const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="inner"><p>Select and copy this key, then paste it into GitHub as the secret VAPID_PRIVATE_KEY.</p><div class="box"><code style="overflow-wrap:anywhere">${esc(v.priv)}</code></div><button class="btn" id="kc">Close</button></div>`; document.body.appendChild(m); m.onclick = ev => { if (ev.target === m || ev.target.id === "kc") m.remove() } }
}

/* ---------- helpers ---------- */
const cleanTitle = t => t.replace(/\s*[(\[][^)\]]*(onsite|on-site|remote|hybrid|salary|pkr|aed|sar|lahore|karachi|dubai|riyadh|full[- ]time|part[- ]time)[^)\]]*[)\]]/ig, "").replace(/\s{2,}/g, " ").trim() || t;
const modeLabel = j => ({ onsite: "Onsite", hybrid: "Hybrid", remote_open: "Remote", remote_restricted: "Remote*", unclear: "Place?" }[j.mode] || "Place?");
const ROUTE = { "Email": "✉ Email", "Easy Apply": "⚡ Easy Apply", "LinkedIn (Easy Apply?)": "LinkedIn", "Apply with Indeed": "Indeed", "Company site": "Company site", "Company form": "Company site", "Govt portal": "Govt portal" };
const placeOf = j => j.place || (j.location || "").split(",")[0];
const ageText = j => { const d = j.age_days; if (d == null) return ""; return d <= 0 ? "today" : d < 14 ? d + "d" : Math.round(d / 7) + "w" };
const dueText = j => { if (!j.deadline || j.deadline === "Not stated") return ""; const d = new Date(j.deadline); return isNaN(d) ? "" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) };
const visibleFlags = j => j.flags.filter(f => !/ask about visa/i.test(f));
const whereOf = j => /Lahore/.test(j.bucket) ? "Lahore" : /remote|Remote/.test(j.bucket) ? "Remote" : /Gulf/.test(j.bucket) ? "Gulf" : "Other";
const focusInd = j => /account|financ|audit|tax|bank|insur/i.test((j.industry || "") + " " + j.company);
const open_ = () => S.jobs.filter(j => j.tier !== "Skip" && !S.marks[j.id]);
const PRED = { tier: (j, v) => j.tier === v, where: (j, v) => whereOf(j) === v, pay: (j, v) => !!j.pay, effort: (j, v) => j.effort === v, sector: (j, v) => !!j.sector, fresh: (j, v) => !!j.new, ind: (j, v) => focusInd(j) || j.watch };
const SORTS = { best: (a, b) => ORDER[a.tier] - ORDER[b.tier] || (BRANK[a.bucket] ?? 5) - (BRANK[b.bucket] ?? 5) || b.fit - a.fit, new: (a, b) => (a.age_days ?? 999) - (b.age_days ?? 999), pay: (a, b) => (b.pay_mid || 0) - (a.pay_mid || 0), due: (a, b) => (dueText(a) ? a.deadline : "9") < (dueText(b) ? b.deadline : "9") ? -1 : 1 };
const SORT_NAMES = { best: "Best first", new: "Newest", pay: "Highest pay", due: "Closing soon" };
function matches(j, skip) {
  const q = S.q.toLowerCase();
  return Object.keys(S.f).every(k => k === skip || S.f[k] === "all" || PRED[k](j, S.f[k])) && (!q || (j.title + " " + j.company + " " + j.location + " " + (j.industry || "")).toLowerCase().includes(q));
}
const visible = () => open_().filter(j => matches(j)).sort(SORTS[S.sort]);
const activeCount = () => Object.keys(S.f).filter(k => S.f[k] !== "all").length;
const cleanCo = c => { const l = c.split("|")[0].trim(); const latin = l.replace(/[\u0600-\u06ff]/g, "").trim(); return latin || l };
function meta(j) {
  const abroad = !/pakistan/i.test(j.location || "") && !/^P1 Lahore/.test(j.bucket);
  const m = [], md = modeLabel(j);
  m.push(`<span class="${md.startsWith("Remote") ? "m-remote" : j.mode === "onsite" && abroad ? "m-abroad" : "m-muted"}">${md}</span>`);
  if (j.pay) m.push(`<span class="m-pay ${j.pay_band === "excellent" || j.pay_band === "good" ? "m-remote" : ""}">${esc(j.pay)}${j.pay_min_only ? "+" : ""}</span>`);
  m.push(`<span class="m-route">${esc(ROUTE[j.route] || j.route)}</span>`);
  const need = (j.extras || []).filter(x => x !== "References").map(x => x === "Loom video" ? "▶ video" : x === "Cover letter" ? "✎ letter" : x.toLowerCase());
  if (need.length) m.push(`<span class="m-need">${need.join(" ")}</span>`);
  if (j.cv.edits.length) m.push(`<span class="m-cv">✎ CV ${j.cv.edits.length}</span>`);
  if (visibleFlags(j).length) m.push(`<span class="m-warn">⚠ ${visibleFlags(j).length}</span>`);
  if (j.visa === "sponsored") m.push(`<span class="m-remote">Visa ✓</span>`);
  if (j.contract && j.contract !== "FT") m.push(`<span class="m-muted">${j.contract}</span>`);
  if (j.sector) m.push(`<span class="m-muted">${j.sector}</span>`);
  const due = dueText(j); if (due) m.push(`<span class="m-warn">Due ${due}</span>`); else if (ageText(j)) m.push(`<span class="m-muted">${ageText(j)}</span>`);
  return m.join("");
}
const chipsFor = j => `<div class="meta">${meta(j)}</div>`;
function toast(msg, ...acts) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.innerHTML = `<span>${esc(msg)}</span>` + acts.map((a, i) => `<button class="btn ghost" data-a="${i}">${esc(a[0])}</button>`).join("");

function kit() {
  const p = S.profile, rows = [["Name", p.name], ["Phone", p.phone], ["Email", p.email], ["LinkedIn", p.linkedin], ["Interactive CV", p.cvsite], ["Notice period", p.notice]].filter(r => r[1]);
  return `<div class="box"><h3 style="margin-top:0">Your details</h3>${rows.map(r => `<div class="kv"><span>${r[0]}</span><code>${esc(r[1])}</code><button class="btn ghost" data-copy="${esc(r[1])}">Copy</button></div>`).join("") || '<span class="muted">Add your details in Profile first.</span>'}<div class="small muted" style="margin-top:6px">Salary expectation: you type it yourself.</div></div>`;
}
function AddJob(shot) {
  const m = document.createElement("div"); m.className = "sheet"; m.id = "addsheet";
  m.innerHTML = `<div class="bar"><button class="btn ghost" id="aback">← Back</button></div><h2>Add a job</h2>
  <p class="muted">${shot ? "Screenshots go through GitHub's own form so they can be attached." : "Paste a link or the posting text."}</p>
  <label>Link<input type="text" id="alink" placeholder="https://" value="${esc(S.shareUrl || "")}"></label>
  <label>Posting text (optional)<textarea id="atext">${esc(S.shareText || "")}</textarea></label>
  <label>Note (optional)<input type="text" id="anote"></label>
  <div class="row2"><button class="btn primary" id="asend">${shot ? "Open GitHub form" : "Send to the engine"}</button></div>`;
  document.body.appendChild(m); $("#aback", m).onclick = () => m.remove();
  $("#asend", m).onclick = async () => {
    const link = $("#alink", m).value.trim(), text = $("#atext", m).value.trim(), note = $("#anote", m).value.trim();
    if (!link && !text) return toast("Add a link or paste the text first");
    const body = `Link: ${link || "-"}\nNote: ${note || "-"}\n\nPosting text:\n${text || "-"}`;
    if (shot) { window.open(`https://github.com/${S.cfg.repo}/issues/new?labels=add-job&title=${encodeURIComponent("Add a job")}&body=${encodeURIComponent(body + "\n\nAttach screenshots below this line:\n")}`, "_blank"); return }
    try { const i = await issue("Add a job: " + (link || text.slice(0, 50)), body, ["add-job"]); S.sent.push({ n: i.number, kind: "Added job", title: link || text.slice(0, 50), at: today() }); ls.set("jp.sent", S.sent); m.remove(); render(); toast("Sent as issue #" + i.number) } catch (e) { toast(e.message) }
  };
}

/* ---------- render and events ---------- */
function render() {
  $("#title").textContent = TABS.find(t => t[0] === S.tab)[1]; $("#upd").textContent = "Updated " + ago(S.generated);
  $("#selmode").hidden = S.tab !== "leads"; $("#selmode").textContent = S.sel ? "Cancel" : "Select";
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" aria-selected="${S.tab === k}" data-tab="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${l}</button>`).join("");
  const keep = $("#main").scrollTop;
  $("#main").innerHTML = { home: Home, leads: Leads, applied: Applied, profile: Profile }[S.tab]();
  $("#main").scrollTop = keep; document.getElementById("sheet")?.remove();
  if (S.open) { const j = S.jobs.find(x => x.id === S.open); if (j) { document.body.insertAdjacentHTML("beforeend", Detail(j)); bindDetail(j) } }
  bindSwipe();
}
function bindDetail(j) {
  $("#back").onclick = () => { S.open = null; render() };
  $("#doapply") && ($("#doapply").onclick = () => quickApply(j));
  $("#doskip") && ($("#doskip").onclick = () => quickSkip(j));
  $("#dounmark") && ($("#dounmark").onclick = () => { unmark(j); S.open = null; render() });
  $("#asksend").onclick = async () => { const q = $("#ask").value.trim(); if (!q) return; try { const i = await issue("Question: " + j.title.slice(0, 60), `Job: ${j.url}\nJob id: ${j.id}\n\nQuestion: ${q}`, ["ask"]); S.sent.push({ n: i.number, kind: "Question", title: q.slice(0, 80), at: today(), job: j.id }); ls.set("jp.sent", S.sent); toast("Question sent as issue #" + i.number); render() } catch (e) { toast(e.message) } };
  $("#sheet").onclick = async e => {
    const c = e.target.closest("[data-copy]"); if (c) copy(c.dataset.copy);
    const r = e.target.closest("[data-reply]"); if (r) { try { const cs = await gh("/issues/" + r.dataset.reply + "/comments"); $("#rep" + r.dataset.reply).textContent = cs.length ? cs[cs.length - 1].body : "No reply yet. The engine answers after its next processing step." } catch (x) { toast(x.message) } }
  };
}
function bindSwipe() {
  document.querySelectorAll(".swipe").forEach(sw => {
    const c = sw.querySelector(".card"), id = sw.dataset.id; let x0 = 0, y0 = 0, dx = 0, drag = false, moved = false;
    c.addEventListener("pointerdown", e => { if (S.sel) return; x0 = e.clientX; y0 = e.clientY; dx = 0; drag = true; moved = false; c.classList.add("dragging") });
    c.addEventListener("pointermove", e => { if (!drag) return; dx = e.clientX - x0; if (Math.abs(dx) > 8 && Math.abs(e.clientY - y0) < 30) { moved = true; try { c.setPointerCapture(e.pointerId) } catch (x) {} c.style.transform = `translateX(${dx}px)` } });
    const end = () => { if (!drag) return; drag = false; c.classList.remove("dragging"); const j = S.jobs.find(x => x.id === id);
      if (moved && dx > 110) { c.style.transform = "translateX(110%)"; setTimeout(() => quickApply(j), 120) }
      else if (moved && dx < -110) { c.style.transform = "translateX(-110%)"; setTimeout(() => quickSkip(j), 120) } else c.style.transform = "" };
    c.addEventListener("pointerup", end); c.addEventListener("pointercancel", end);
    c.addEventListener("click", e => { if (e.target.closest("[data-legend]") && !S.sel) return; if (moved) { e.preventDefault(); moved = false; return }
      if (S.sel) { S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); renderKeep(); return } S.open = id; render() });
  });
}
const renderKeep = () => { const k = $("#main").scrollTop; render(); $("#main").scrollTop = k };
document.addEventListener("click", e => {
  if (e.target.id === "fsheet") { e.target.remove(); return }
  const lg = e.target.closest("[data-legend]"); if (lg && !S.sel) { e.stopPropagation(); legend(); return }
  const t = e.target.closest("[data-tab]"); if (t) { S.tab = t.dataset.tab; S.open = null; S.sel = null; render(); return }
  const f = e.target.closest("[data-f]"); if (f) { S.f[f.dataset.f] = S.f[f.dataset.f] === f.dataset.v ? "all" : f.dataset.v; ls.set("jp.f", S.f); render(); filterSheet(); return }
  const so = e.target.closest("[data-sort]"); if (so) { S.sort = so.dataset.sort; ls.set("jp.sort", S.sort); render(); filterSheet(); return }
  const cl = e.target.closest("[data-clear]"); if (cl) { S.f[cl.dataset.clear] = "all"; ls.set("jp.f", S.f); render(); return }
  const u = e.target.closest("[data-undo]"); if (u) { unmark(S.jobs.find(j => j.id === u.dataset.undo)); return }
  const rs = e.target.closest("[data-reason]"); if (rs) { reasonSheet([rs.dataset.reason]); return }
  const sg = e.target.closest("[data-stage]"); if (sg) { const [id, k] = sg.dataset.stage.split("|"); const cur = (S.marks[id].stages || {})[k];
    const m = document.createElement("div"); m.className = "modal"; m.innerHTML = `<div class="inner"><h2 style="margin:0 0 8px;font-size:18px">${STAGES.find(s => s[0] === k)[1]}</h2><label>Date<input type="date" id="sd" value="${cur || today()}"></label><div class="row2"><button class="btn" id="sx">Clear</button><button class="btn primary" id="sok">Save</button></div></div>`;
    document.body.appendChild(m); m.onclick = ev => { if (ev.target === m) m.remove() }; $("#sx", m).onclick = () => { m.remove(); setStage(id, k, "") }; $("#sok", m).onclick = () => { const d = $("#sd", m).value; m.remove(); setStage(id, k, d) }; return }
  const o = e.target.closest("[data-open]"); if (o && !S.sel && !e.target.closest(".swipe") && !e.target.closest("button")) { S.open = o.dataset.open; render(); return }
  const ac = e.target.closest("[data-acct]"); if (ac) { const a = S.profile.accts || [], n = ac.dataset.acct; S.profile.accts = a.includes(n) ? a.filter(x => x !== n) : [...a, n]; ls.set("jp.profile", S.profile); render(); return }
  const id = e.target.id;
  if (id === "openf") filterSheet();
  if (id === "fdone") document.getElementById("fsheet")?.remove();
  if (id === "freset") { S.f = { ...FDEF }; ls.set("jp.f", S.f); render(); filterSheet() }
  if (id === "addjob") AddJob(false); if (id === "addshot") AddJob(true); if (id === "refresh") load();
  if (id === "selmode") { S.sel = S.sel ? null : new Set(); render() }
  if (id === "bskip" && S.sel.size) { const ids = [...S.sel]; ids.forEach(i => mark(S.jobs.find(j => j.id === i), "skipped")); S.sel = null; render(); reasonSheet(ids) }
  if (id === "bapply" && S.sel.size) { const n = S.sel.size; [...S.sel].forEach(i => mark(S.jobs.find(j => j.id === i), "applied")); S.sel = null; render(); toast(n + " marked applied") }
  if (id === "savecfg") { S.cfg = { repo: $("#repo").value.trim() || REPO_DEFAULT, token: $("#token").value.trim() }; S.profile.tokenExp = $("#tokenExp").value; ls.set("jp.profile", S.profile); ls.set("jp.cfg", S.cfg); load(); toast("Saved") }
  if (id === "restore") restore();
  if (id === "enpush") enablePush();
  if (id === "showkey") showKey();
  if (id === "pushtest") issue("Test notification", "Please send a test notification.", ["push-test"]).then(i => toast("Test requested (issue #" + i.number + "). It arrives in about a minute.")).catch(x => toast(x.message));
  if (id === "savep") { ["name", "phone", "email", "linkedin", "cvsite", "gmail", "notice"].forEach(k => S.profile[k] = $("#" + k).value.trim()); ls.set("jp.profile", S.profile); toast("Details saved") }
  if (id === "sendprefs") { const v = [...document.querySelectorAll("[data-pref]")].map(i => i.value.trim()); S.profile.prefs = v; ls.set("jp.profile", S.profile); const names = ["Industries to watch", "Companies to watch", "Preferred position names", "Companies to avoid", "Jobs or roles to avoid"]; issue("Update preferences", names.map((n, i) => `### ${n}\n\n${v[i] || "_No response_"}`).join("\n\n"), ["prefs"]).then(i => { S.sent.push({ n: i.number, kind: "Preferences", title: "Preference lists", at: today() }); ls.set("jp.sent", S.sent); toast("Sent as issue #" + i.number) }).catch(x => toast(x.message)) }
  if (id === "syncev") syncEvents().then(() => { toast("Done"); render() });
});
document.addEventListener("input", e => { if (e.target.id === "q") { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos) } });
const sp = new URLSearchParams(location.search);
if (sp.get("url") || sp.get("text")) { S.shareUrl = (sp.get("url") || (sp.get("text") || "").match(/https?:\/\/\S+/)?.[0] || ""); S.shareText = sp.get("text") && !/^https?:\/\/\S+$/.test(sp.get("text")) ? sp.get("text") : ""; history.replaceState(null, "", location.pathname); setTimeout(() => AddJob(false), 50) }
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
const cached = ls.get("jp.cache", null); if (cached) { S.jobs = cached.jobs; S.generated = cached.generated }
render(); load();
</script>
</body>
